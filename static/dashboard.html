<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Claw 项目排期看板</title>
  <link rel="stylesheet" href="styles.css?v=20260605-h5y">
  <script src="icons.js?v=20260605-h5y"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="top-nav">
      <div class="brand">
        <span class="brand-mark loading" data-icon="board"></span>
        <span class="brand-title loading" id="navTitle">Claw 项目排期看板</span>
      </div>
      <div class="nav-links">
        <a class="nav-link active" href="dashboard.html" data-nav-icon="board">前台看板</a>
        <a class="nav-link" href="admin.html" data-nav-icon="admin">后台管理</a>
        <a class="nav-link" href="tv.html" data-nav-icon="tv">电视看板</a>
      </div>
    </nav>

    <main class="main full">
      <section class="board-layout" id="boardRoot">
        <div class="toolbar">
          <div class="toolbar-title">
            <span data-icon="calendar"></span>
            <h1>项目排期</h1>
            <span class="tag tag-primary" id="todayTag"></span>
            <span class="tag" id="syncStatusBar" style="display:none">
              <span data-icon="clock"></span>
              <span data-sync-text>同步状态</span>
              <strong data-sync-countdown></strong>
            </span>
            <span class="tag tag-muted" id="updateTime"></span>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-danger" id="deleteModeBtn" type="button"><span data-icon="trash"></span>删除模式</button>
            <button class="btn" id="resetBtn" type="button"><span data-icon="arrowLeft"></span>回到今天</button>
            <select class="select" id="daySelect" aria-label="显示天数" style="width:auto">
              <option value="14">14天</option>
              <option value="30" selected>30天</option>
              <option value="60">60天</option>
            </select>
            <button class="btn btn-primary" id="refreshBtn" type="button"><span data-icon="refresh"></span>刷新</button>
          </div>
        </div>

        <section class="panel person-pool" id="personPool">
          <div class="pool-head">
            <div class="pool-title"><span data-icon="users"></span>人员列表</div>
            <span class="tag">拖拽到项目上分配，默认 1 天</span>
          </div>
          <div class="pool-body" id="personChips"></div>
        </section>

        <section class="gantt-wrapper" id="ganttWrapper">
          <div class="gantt" id="gantt"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="board.js?v=20260605-h5y"></script>
  <script>
    document.querySelectorAll("[data-icon]").forEach((el) => el.innerHTML = Icons.svg(el.dataset.icon));
    document.querySelectorAll("[data-nav-icon]").forEach((el) => el.insertAdjacentHTML("afterbegin", Icons.svg(el.dataset.navIcon)));
    window.boardApp = new BoardApp({ rootId: "boardRoot", readonly: false });
    window.boardApp.init();
  </script>
</body>
</html>
