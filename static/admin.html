<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - Claw 项目排期看板</title>
  <link rel="stylesheet" href="styles.css?v=20260605-h5y">
  <script src="icons.js?v=20260605-h5y"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="top-nav">
      <div class="brand">
        <span class="brand-mark loading" data-icon="admin"></span>
        <span class="brand-title loading" id="navTitle">Claw 项目排期看板 · 后台管理</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="dashboard.html" data-nav-icon="board">前台看板</a>
        <a class="nav-link active" href="admin.html" data-nav-icon="admin">后台管理</a>
        <a class="nav-link" href="tv.html" data-nav-icon="tv">电视看板</a>
      </div>
    </nav>

    <main class="main">
      <div class="stack">
        <section class="toolbar">
          <div class="toolbar-title">
            <span data-icon="admin"></span>
            <h1>后台管理</h1>
            <span class="tag tag-muted">项目、人员、请假与系统配置</span>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-primary" id="addProjectBtn" type="button"><span data-icon="plus"></span>添加项目</button>
            <button class="btn btn-success" id="syncPersonsBtn" type="button"><span data-icon="refresh"></span>同步人员</button>
            <button class="btn btn-success" id="syncLeaveBtn" type="button"><span data-icon="refresh"></span>同步请假</button>
            <button class="btn" id="configBtn" type="button"><span data-icon="admin"></span>系统配置</button>
            <button class="btn" id="exportJsonBtn" type="button"><span data-icon="download"></span>导出 JSON</button>
            <button class="btn" id="exportCsvBtn" type="button"><span data-icon="download"></span>导出 CSV</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title"><span data-icon="board"></span>项目列表</h2>
            <span class="tag tag-primary" id="projectCount">0 个</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>项目名称</th>
                  <th>开始日期</th>
                  <th>结束日期</th>
                  <th>出差状态</th>
                  <th>出差日期</th>
                  <th>出差人员</th>
                  <th class="actions">操作</th>
                </tr>
              </thead>
              <tbody id="projectBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title"><span data-icon="users"></span>人员列表</h2>
            <span class="tag tag-primary" id="personCount">0 人</span>
          </div>
          <div id="personList"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title"><span data-icon="calendar"></span>请假记录</h2>
            <span class="tag tag-primary" id="leaveRecordCount">0 条</span>
          </div>
          <div id="leaveRecordList"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="projectModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="card-title" id="projectModalTitle">添加项目</h2>
        <button class="btn btn-sm" data-close-modal="projectModal" type="button"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body form-grid">
        <div class="field"><label>项目名称</label><input class="input" id="projectName" type="text"></div>
        <div class="form-row">
          <div class="field"><label>开始日期</label><input class="input" id="projectStart" type="date"></div>
          <div class="field"><label>结束日期</label><input class="input" id="projectEnd" type="date"></div>
        </div>
        <div class="field">
          <label>项目颜色</label>
          <div class="color-picker-row" id="projectColorPicker"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close-modal="projectModal" type="button">取消</button>
        <button class="btn btn-primary" id="saveProjectBtn" type="button"><span data-icon="save"></span>保存</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="businessTripModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="card-title"><span data-icon="plane"></span>出差配置</h2>
        <button class="btn btn-sm" data-close-modal="businessTripModal" type="button"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body form-grid">
        <input id="btProjectId" type="hidden">
        <div class="trip-summary">
          <span class="tag tag-trip">项目</span>
          <strong id="btProjectName"></strong>
        </div>
        <label class="toggle-row"><input type="checkbox" id="projectBusinessTrip">启用项目出差</label>
        <div class="form-row">
          <div class="field"><label>出发日期</label><input class="input" id="projectBusinessTripStart" type="date"></div>
          <div class="field"><label>返回日期</label><input class="input" id="projectBusinessTripEnd" type="date"></div>
        </div>
        <div class="field">
          <label>出差人员</label>
          <div class="person-check-grid" id="businessTripPersons"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close-modal="businessTripModal" type="button">取消</button>
        <button class="btn btn-primary" id="saveBusinessTripBtn" type="button"><span data-icon="save"></span>保存出差配置</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="syncPersonsModal">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2 class="card-title"><span data-icon="users"></span>同步钉钉人员</h2>
        <button class="btn btn-sm" data-close-modal="syncPersonsModal" type="button"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body sync-modal-body">
        <div class="sync-toolbar">
          <button class="btn btn-success" id="fetchDingUsersBtn" type="button"><span data-icon="refresh"></span>获取钉钉人员</button>
          <span class="sync-sep"></span>
          <span class="sync-status" id="syncPersonsStatus">等待获取</span>
        </div>
        <div id="syncPersonsList"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close-modal="syncPersonsModal" type="button">取消</button>
        <button class="btn btn-primary" id="saveSelectedPersonsBtn" type="button"><span data-icon="save"></span>同步选中人员（0）</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="leaveModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="card-title">请假记录</h2>
        <button class="btn btn-sm" data-close-modal="leaveModal" type="button"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body form-grid">
        <div class="field"><label>人员</label><input class="input" id="leavePersonName" type="text" disabled></div>
        <div class="field"><label>请假类型</label><input class="input" id="leaveType" type="text" value="请假"></div>
        <div class="form-row">
          <div class="field"><label>开始日期</label><input class="input" id="leaveStart" type="date"></div>
          <div class="field"><label>结束日期</label><input class="input" id="leaveEnd" type="date"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" id="clearLeaveBtn" type="button">清空请假</button>
        <button class="btn" data-close-modal="leaveModal" type="button">取消</button>
        <button class="btn btn-primary" id="saveLeaveBtn" type="button"><span data-icon="save"></span>保存</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="configModal">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2 class="card-title">系统配置</h2>
        <button class="btn btn-sm" data-close-modal="configModal" type="button"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body settings-grid">
        <section class="settings-section">
          <h3>基础设置</h3>
          <div class="field"><label>项目标题</label><input class="input" id="projectTitle" type="text"></div>
          <div class="field"><label>默认分配天数</label><input class="input" id="defaultAssignDays" type="number" min="1" max="30"></div>
          <div class="field"><label>界面主题色</label><input class="input color-input" id="themePrimary" type="color"></div>
        </section>
        <section class="settings-section">
          <h3>钉钉同步</h3>
          <div class="field"><label>钉钉 AppKey</label>
            <div class="input-row">
              <input class="input" id="dingAppKey" type="text" readonly>
              <button class="btn btn-sm" id="editDingBtn" type="button">编辑</button>
            </div>
          </div>
          <div class="field"><label>钉钉 AppSecret</label>
            <div class="input-row">
              <input class="input" id="dingAppSecret" type="password" readonly>
            </div>
          </div>
          <div class="ding-save-row" id="dingSaveRow" style="display:none">
            <button class="btn btn-primary btn-sm" id="saveDingBtn" type="button"><span data-icon="save"></span>保存钉钉配置</button>
            <span class="tag tag-primary" id="dingSavedTag" style="display:none">已配置</span>
          </div>
          <div class="inline-actions">
            <button class="btn btn-success" id="testDingTalkBtn" type="button"><span data-icon="refresh"></span>测试钉钉连接</button>
            <span class="tag" id="dingTestResult" style="display:none"></span>
          </div>
        </section>
        <section class="settings-section">
          <h3>部门颜色</h3>
          <div class="dept-color-grid" id="deptColorGrid"></div>
        </section>
        <section class="settings-section">
          <h3>状态颜色</h3>
          <div class="status-color-grid" id="statusColorGrid">
            <div class="field"><label>即将出差</label><input class="input color-input" id="tripUpcomingColor" type="color"></div>
            <div class="field"><label>出差中</label><input class="input color-input" id="tripActiveColor" type="color"></div>
            <div class="field"><label>请假中</label><input class="input color-input" id="leaveActiveColor" type="color"></div>
            <div class="field"><label>即将请假</label><input class="input color-input" id="leaveUpcomingColor" type="color"></div>
            <div class="field"><label>冲突提示</label><input class="input color-input" id="conflictColor" type="color"></div>
          </div>
        </section>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close-modal="configModal" type="button">取消</button>
        <button class="btn btn-warning" id="resetConfigBtn" type="button"><span data-icon="refresh"></span>恢复默认颜色</button>
        <button class="btn btn-primary" id="saveConfigBtn" type="button"><span data-icon="save"></span>保存配置</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
  <script src="admin.js?v=20260605-h5y"></script>
  <script>AdminApp.init();</script>
</body>
</html>
