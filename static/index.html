<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claw 项目排期看板</title>
  <link rel="stylesheet" href="styles.css?v=20260605-h5y">
  <script src="icons.js?v=20260605-h5y"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="top-nav">
      <div class="brand">
        <span class="brand-mark loading" data-icon="board"></span>
        <span class="brand-title loading" id="navTitle">Claw 项目排期看板</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="dashboard.html" data-nav-icon="board">前台看板</a>
        <a class="nav-link" href="admin.html" data-nav-icon="admin">后台管理</a>
        <a class="nav-link" href="tv.html" data-nav-icon="tv">电视看板</a>
      </div>
    </nav>

    <main class="main home">
      <section class="home-panel">
        <h1 class="home-title loading" id="mainTitle">Claw 项目排期看板</h1>
        <p class="home-subtitle">项目甘特图、人员分配、请假与出差状态集中管理。选择一个入口开始工作。</p>
        <div class="entry-grid">
          <a class="entry-card" href="dashboard.html">
            <span data-icon="board"></span>
            <span class="entry-title">前台看板</span>
            <span class="entry-desc">查看排期、拖拽分配人员、调整任务时间。</span>
          </a>
          <a class="entry-card" href="admin.html">
            <span data-icon="admin"></span>
            <span class="entry-title">后台管理</span>
            <span class="entry-desc">管理项目、人员、配置、请假和出差信息。</span>
          </a>
          <a class="entry-card" href="tv.html">
            <span data-icon="tv"></span>
            <span class="entry-title">电视看板</span>
            <span class="entry-desc">只读展示前台看板，适合会议室或大屏播放。</span>
          </a>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.querySelectorAll("[data-icon]").forEach((el) => el.innerHTML = Icons.svg(el.dataset.icon));
    document.querySelectorAll("[data-nav-icon]").forEach((el) => el.insertAdjacentHTML("afterbegin", Icons.svg(el.dataset.navIcon)));
    fetch("api/config").then((r) => r.json()).then((config) => {
      const title = config.project_title || "Claw 项目排期看板";
      document.title = title;
      const navTitle = document.getElementById("navTitle");
      navTitle.textContent = title;
      navTitle.classList.remove("loading");
      const mainTitle = document.getElementById("mainTitle");
      mainTitle.textContent = title;
      mainTitle.classList.remove("loading");
      const primary = config.theme_primary || config.primary_color || "#3157d5";
      document.documentElement.style.setProperty("--primary", primary);
      document.querySelector(".brand-mark")?.classList.remove("loading");
    }).catch(() => {});
  </script>
</body>
</html>
